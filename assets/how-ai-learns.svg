<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
  <title id="t">How most AI systems work</title>
  <desc id="d">Data flows into training, which produces a model. The model produces an output. A human check reviews the output before use.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#231a14"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#fdf4ec"/>
  <g font-family="system-ui, Arial, sans-serif" font-size="16" fill="#231a14" text-anchor="middle">
    <rect x="20"  y="40" width="150" height="80" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <text x="95"  y="76" font-weight="700">1. Data</text>
    <text x="95"  y="98" font-size="13">text, images, examples</text>

    <rect x="208" y="40" width="150" height="80" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="3"/>
    <text x="283" y="76" font-weight="700">2. Training</text>
    <text x="283" y="98" font-size="13">finds patterns</text>

    <rect x="396" y="40" width="150" height="80" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
    <text x="471" y="76" font-weight="700">3. Model</text>
    <text x="471" y="98" font-size="13">stores the patterns</text>

    <rect x="584" y="40" width="156" height="80" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <text x="662" y="76" font-weight="700">4. Output</text>
    <text x="662" y="98" font-size="13">answer, image, action</text>

    <g stroke="#231a14" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="172" y1="80" x2="204" y2="80"/>
      <line x1="360" y1="80" x2="392" y2="80"/>
      <line x1="548" y1="80" x2="580" y2="80"/>
    </g>

    <rect x="400" y="170" width="340" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="570" y="196" font-weight="700" fill="#78350f">Human check</text>
    <text x="570" y="216" font-size="13" fill="#78350f">verify before you trust or act</text>
    <path d="M662 122 L662 166" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <text x="20" y="215" font-size="13" text-anchor="start" fill="#5c4e45">Errors in the data or the patterns</text>
    <text x="20" y="233" font-size="13" text-anchor="start" fill="#5c4e45">can appear as confident wrong answers.</text>
  </g>
</svg>
